# se crea el volumen de nuestro dockerfile
volumes:
    mariadb_data:

# se crea la red de nuestro dockerfile
networks:
    hikey:

# se genera el docker run de nuestro servicio
services:
    app:
        build:
            context: ./dockerfiles
            dockerfile: nginx.dockerfile
            args:
                - UID=${UID:-1000}
                - GID=${GID:-1000}
        ports:
            - "80:80"
        volumes:
            - .:/var/www/html:delegated
        depends_on:
            - php
            - redis
            - mariadb
            - mailpit
        networks:
            - hikey

    mariadb:
        image: mariadb:13.0-rc
        restart: unless-stopped
        tty: true
        ports:
            - "3307:3306"
        environment:
            - MYSQL_DATABASE=hikey
            - MYSQL_USER=homestead
            - MYSQL_PASSWORD=secret
            - MYSQL_ROOT_PASSWORD=secret
        volumes:
            - mariadb_data:/var/lib/mysql
        networks:
            - hikey 

    php:
        build:
            context: ./dockerfiles
            dockerfile: php.dockerfile
            args:
                - UID=${UID:-1000}
                - GID=${GID:-1000}
        ports:
            - "9000:9000"
        volumes:
            - .:/var/www/html:delegated
        networks:
            - hikey

    redis:
        image: redis:alpine3.23
        restart: unless-stopped
        ports:
            - "6379:6379"
        networks:
            - hikey

    composer:
        build:
            context: ./dockerfiles
            dockerfile: php.dockerfile
            args:
                - UID=${UID:-1000}
                - GID=${GID:-1000}
        volumes:
            - .:/var/www/html
        depends_on:
            - php
        entrypoint: [ 'composer', '--ignore-plataform-reqs' ]
        networks:
            - hikey

    npm:
        image: node:alpine3.23
        volumes:
            - .:/var/www/html
        ports:
            - "3000:3000"
            - "3001:3001"
            - "5173:5173"
        working_dir: /var/www/html
        entrypoint: [ 'npm' ]
        command: [ 'run', 'dev', '--', '--host', '0.0.0.0' ]
        networks:
            - hikey

    artisan:
        build:
            context: ./dockerfiles
            dockerfile: php.dockerfile
            args:
                - UID=${UID:-1000}
                - GID=${GID:-1000}
        volumes:
            - .:/var/www/html:delegated
        depends_on:
            - mariadb
        entrypoint: [ 'php', '/var/www/html/artisan' ]
        networks:
            - hikey

    mailpit:
        image: axllent/mailpit:latest
        restart: unless-stopped
        volumes:
            - ./data:/data
        ports:
            - "8025:8025"
            - "1025:1025"
        environment:
            - MP_MAX_MESSAGES=5000
            - MP_DATABASE=/data/mailpit.db
            - MP_SMTP_AUTH_ACCEPT_ANY=1
            - MP_SMTP_AUTH_ALLOW_INSECURE=1
        networks:
            - hikey


